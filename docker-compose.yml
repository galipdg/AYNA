# Starts the whole AYNA backend: `docker compose up`.
# Dev defaults only; set NEO4J_PASSWORD in a local .env for anything else,
# and AYNA_SERVER_PORT there when another program holds 8080 (#208).
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ayna-dev-password}
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ayna-dev-password}
      AYNA_ADMIN_USERNAME: ${AYNA_ADMIN_USERNAME:-}
      AYNA_ADMIN_PASSWORD: ${AYNA_ADMIN_PASSWORD:-}
      AYNA_SCREENSHOT_DIR: /data/screenshots
      AYNA_RUN_RETENTION: ${AYNA_RUN_RETENTION:-1000}
      AYNA_RUN_IDLE_TIMEOUT: ${AYNA_RUN_IDLE_TIMEOUT:-60m}
      AYNA_SCREENSHOT_MAX_SIZE: ${AYNA_SCREENSHOT_MAX_SIZE:-8MB}
      # The run report (#59) writes its times in this zone; the image's default is UTC.
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - screenshots:/data/screenshots
    ports:
      - "${AYNA_SERVER_PORT:-8080}:8080"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
  screenshots:
