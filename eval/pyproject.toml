[project]
name = "ayna-eval"
version = "0.0.0"
description = "AYNA evaluation material: trial and sample apps, measurement scripts, NL dataset"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    # eval/nl/check_pairs.py
    "jsonschema~=4.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff~=0.17.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Scripts and apps, not an importable package: install only the dependencies.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
# CI runs a bare `pytest` from `eval/`, so a new experiment folder is invisible until it
# is listed here.
testpaths = [
    "apps/trial/tests",
    "apps/sample/tests",
    "llm-latency/tests",
    "rq1/tests",
]

[tool.ruff]
target-version = "py311"
# The apps and their tests import `app`, `model`, `texts`, `windows` and `uia_dump`, and
# `llm-latency/tests` imports `run` and `rq1/tests` imports `measure`, as local modules, so
# ruff has to know they are first-party.
src = [".", "apps/trial", "apps/sample", "llm-latency", "rq1"]
# Throwaway spike scripts are not held to the module lint rules.
extend-exclude = ["spikes"]
