name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers integration tests use the runner's Docker.
      - run: ./mvnw -B verify

  client:
    name: client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      # The Electron + React skeleton comes with #5; until then this job only reports that it skipped.
      - if: hashFiles('client/package.json') == ''
        run: |
          echo "::notice::client/package.json not found, skipping client checks (see #5)"
      - if: hashFiles('client/package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - if: hashFiles('client/package.json') != ''
        run: npm ci
      - if: hashFiles('client/package.json') != ''
        run: npm run lint
      - if: hashFiles('client/package.json') != ''
        run: npm run build

  agent:
    name: agent (ruff + pytest, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  ai:
    name: ai (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
