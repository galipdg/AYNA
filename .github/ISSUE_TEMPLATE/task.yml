name: Task
description: A unit of work with acceptance criteria
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be built and why
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: File, endpoint, screen or report this task produces
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist; the task is done only when every box is ticked
      value: |
        - [ ] 
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: Depends on
      description: e.g. #12, #14
