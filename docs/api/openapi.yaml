        id:
          type: string
        name:
          type: string
        token:
          type: string
    FieldError:
      type: object
      properties:
        message:
          type: string
        path:
          type: string
          description: "JSONPath (RFC 9535) into the request body, member names and\
            \ array indices only, e.g. $.steps[2].value"
      required:
      - message
      - path
    FinishRunRequest:
      type: object
      properties:
        status:
