openapi: 3.1.0
info:
  description: |-
    REST API between the AYNA client and server. Generated from the code; do not edit by hand.

    **Frozen as 1.0** (#52, ADR contracts-v1-freeze): later 1.x versions only add endpoints, optional fields and status values, and a client ignores what it does not know. A change that removes or narrows anything needs an ADR and version 2.0; CI compares every pull request with the base branch.

    **Live run status** is a WebSocket at `/ws/runs`, outside this document; its messages are `schemas/ws-runs.schema.json` (ADR runs-api-and-live-updates). The upgrade request carries the same Bearer token; without a valid one it gets 401, and a token that expires or is revoked closes the connection with 1008 within 60 s. Subscribe with `{"type":"subscribe","testId":"…"}`; the server then sends `subscribed`, `run.started`, `run.stepResult` and `run.finished` for that test, and `error` for a message it cannot use. Nothing is replayed: after `subscribed` and after a reconnect, read `GET /api/tests/{testId}/runs?status=running` and `GET /api/runs/{runId}`, then merge by `stepIndex`.
  title: AYNA server API
  version: "1.0"
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/apps:
    get:
      operationId: listApps
      responses:
        "200":
          content:
