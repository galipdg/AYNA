          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      tags:
      - user-controller
components:
  responses:
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The request body or a field in it is invalid
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: "The request conflicts with what is stored, such as a name already\
        \ taken"
    ContentTooLarge:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The body is larger than this endpoint takes
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The account's role may not do this
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: An id in the path names nothing
    Unauthorized:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: "No valid session or API token; on login, a wrong user name or\
        \ password"
    UnsupportedMediaType:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: The body's Content-Type is not one this endpoint takes
  schemas:
    AppResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        technology:
          type: string
    ApproveRequest:
      type: object
      properties:
        rank:
          type: integer
          format: int32
    CandidateElement:
      type: object
      properties:
        elementId:
          type: string
        rank:
          type: integer
          format: int32
        snapshotElementId:
          type: string
    CreateAppRequest:
      type: object
      properties:
        name:
          type: string
        technology:
          type: string
    CreateRepoObjectRequest:
      type: object
      properties:
        fallback:
          type: object
          additionalProperties: {}
        name:
          type: string
        primary:
          type: object
          additionalProperties: {}
        snapshotElementId:
          type: string
        snapshotId:
          type: string
    CreateRunRequest:
      type: object
      properties:
        appVersionId:
          type: string
        testId:
          type: string
    CreateTestRequest:
      type: object
      properties:
        name:
          type: string
    CreateTokenRequest:
