# A throwaway AYNA backend for the load test (#152): its own project name, its own
# Neo4j volume and no Neo4j port on the host, so it never touches the data of a
# backend started with the root docker-compose.yml. `run.sh` starts and removes it.
name: ayna-loadtest

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/loadtest-neo4j-password
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: loadtest-neo4j-password
      AYNA_ADMIN_USERNAME: ${AYNA_LOADTEST_USERNAME:-loadtest}
      AYNA_ADMIN_PASSWORD: ${AYNA_LOADTEST_PASSWORD:-loadtest-password}
    ports:
      - "127.0.0.1:${AYNA_LOADTEST_PORT:-18090}:8080"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
