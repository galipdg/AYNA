spring.application.name=ayna-server

# Neo4j connection; docker-compose.yml overrides these through environment variables.
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:ayna-dev-password}

# REST contract (#31): /v3/api-docs(.yaml) and Swagger UI at /swagger-ui.html.
# Sorted keys keep docs/api/openapi.yaml stable between runs. Closed network: no online spec validator,
# no petstore default URL in Swagger UI.
springdoc.writer-with-order-by-keys=true
springdoc.swagger-ui.validator-url=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json

# Accounts live in Neo4j (auth/AccountService); no generated in-memory user with its password in the log.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# Accounts (#60, ADR accounts-and-tokens). The first admin is created from these when no admin
# exists, and they are ignored after that. Session tokens expire this long after login.
ayna.admin.username=${AYNA_ADMIN_USERNAME:}
ayna.admin.password=${AYNA_ADMIN_PASSWORD:}
ayna.auth.session-ttl=${AYNA_SESSION_TTL:12h}
